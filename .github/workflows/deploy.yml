# Build l'app et la publie sur GitHub Pages à chaque push sur main.
# Les actions sont épinglées sur un SHA de commit (immuable) ;
# Dependabot les met à jour automatiquement (voir .github/dependabot.yml).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Par défaut, aucun droit : chaque job ne reçoit que ce dont il a besoin.
permissions: {}

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node (version de .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Envoyer le site buildé
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
